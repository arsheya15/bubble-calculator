
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bubble Calculator</title>

    <style>

         {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, #ffd6ef, transparent 25%),
                radial-gradient(circle at 80% 30%, #cdd8ff, transparent 25%),
                radial-gradient(circle at 50% 90%, #d5f8ff, transparent 30%),
                linear-gradient(135deg, #c7d4ff, #f8c8ee, #c8f3ff);
        }


  

        .page {
            position: relative;
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            z-index: 2;
        }

        h1 {
            margin: 0 0 5px 0;

            font-size: 52px;

            color: white;

            text-shadow:
                3px 3px 0 #d879c7,
                0 0 15px #ffffff;

            letter-spacing: 2px;
        }

        .subtitle {
            margin-bottom: 18px;

            color: white;
            font-size: 20px;

            text-shadow: 1px 2px 5px #9b79bd;
        }


        /* =========================
           CALCULATOR
        ========================= */

        .calculator {

            width: 360px;

            padding: 22px;

            border-radius: 35px;

            background: rgba(255, 205, 240, 0.72);

            border: 4px solid rgba(255, 255, 255, 0.75);

            box-shadow:
                0 20px 40px rgba(104, 65, 150, 0.25),
                inset 0 0 20px rgba(255,255,255,0.5);

            backdrop-filter: blur(12px);

            position: relative;

            z-index: 5;
        }


        /* =========================
           DISPLAY
        ========================= */

        #display {

            width: 100%;
            height: 80px;

            border: none;
            outline: none;

            border-radius: 25px;

            margin-bottom: 18px;

            padding: 15px 20px;

            text-align: right;

            font-size: 32px;

            color: #70459c;

            background: rgba(255,255,255,0.82);

            box-shadow:
                inset 0 5px 12px rgba(155,100,190,0.12),
                0 5px 10px rgba(120,70,150,0.15);
        }


        /* =========================
           BUTTON AREA
        ========================= */

        .buttons {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 13px;
        }


        /* =========================
           BUBBLE BUTTONS
        ========================= */

        button {

            height: 65px;

            border: none;

            border-radius: 50%;

            font-size: 22px;

            font-weight: bold;

            color: #75439d;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;

            box-shadow:
                0 7px 0 rgba(130, 83, 160, 0.22),
                inset 5px 5px 12px rgba(255,255,255,0.8),
                inset -5px -5px 12px rgba(150,80,170,0.12);

            background: linear-gradient(
                145deg,
                #ffd0ed,
                #f59ed1
            );
        }


        /* little shine on every bubble */

        button::before {

            content: "";

            position: absolute;

            width: 18px;
            height: 10px;

            border-radius: 50%;

            background: rgba(255,255,255,0.75);

            top: 10px;
            left: 13px;

            transform: rotate(-25deg);
        }


        /* hover */

        button:hover {

            transform: translateY(-5px) scale(1.05);

            box-shadow:
                0 12px 18px rgba(120,70,160,0.25),
                inset 5px 5px 12px rgba(255,255,255,0.8);
        }


        /* click = POP */

        button.pop {

            animation: pop 0.25s ease;
        }

        @keyframes pop {

            0% {
                transform: scale(1);
            }

            45% {
                transform: scale(0.78);
            }

            75% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================
           DIFFERENT BUTTON COLORS
        ========================= */

        .purple {
            background: linear-gradient(
                145deg,
                #dfcaff,
                #b99af5
            );
        }

        .blue {
            background: linear-gradient(
                145deg,
                #bff2ff,
                #6ed8f5
            );
        }

        .orange {
            background: linear-gradient(
                145deg,
                #ffd9ae,
                #ffb76d
            );
        }

        .green {
            background: linear-gradient(
                145deg,
                #c9f8e7,
                #83dfc0
            );
        }

        .equals {
            background: linear-gradient(
                145deg,
                #ffb9df,
                #ec76bd
            );

            color: white;
        }


        /* =========================
           ZERO BUTTON
        ========================= */

        .zero {
            grid-column: span 2;

            border-radius: 35px;
        }


        /* =========================
           FLOATING BUBBLES
        ========================= */

        .bubble {

            position: fixed;

            border-radius: 50%;

            background: rgba(255,255,255,0.25);

            border: 2px solid rgba(255,255,255,0.5);

            box-shadow:
                inset 5px 5px 12px rgba(255,255,255,0.5),
                0 5px 15px rgba(100,80,160,0.12);

            pointer-events: none;

            z-index: 1;

            animation: float 8s infinite ease-in-out;
        }


        @keyframes float {

            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-40px) rotate(15deg);
            }

            100% {
                transform: translateY(0) rotate(0deg);
            }
        }


        /* different bubbles */

        .bubble1 {
            width: 90px;
            height: 90px;
            left: 5%;
            top: 15%;
        }

        .bubble2 {
            width: 55px;
            height: 55px;
            left: 18%;
            bottom: 10%;
            animation-delay: 1s;
        }

        .bubble3 {
            width: 120px;
            height: 120px;
            right: 5%;
            top: 10%;
            animation-delay: 2s;
        }

        .bubble4 {
            width: 70px;
            height: 70px;
            right: 15%;
            bottom: 12%;
            animation-delay: 3s;
        }

        .bubble5 {
            width: 45px;
            height: 45px;
            left: 10%;
            top: 65%;
            animation-delay: 4s;
        }


        /* =========================
           DECORATIONS
        ========================= */

        .decoration {

            position: fixed;

            font-size: 40px;

            z-index: 3;

            animation: cuteFloat 4s infinite ease-in-out;
        }

        @keyframes cuteFloat {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px) rotate(5deg);
            }

            100% {
                transform: translateY(0);
            }
        }

        .heart1 {
            top: 15%;
            left: 25%;
        }

        .heart2 {
            bottom: 18%;
            right: 25%;
        }

        .butterfly {
            top: 22%;
            right: 20%;
        }

        .star {
            top: 10%;
            left: 10%;
        }

        .bunny {
            bottom: 4%;
            right: 5%;
            font-size: 70px;
        }


        /* =========================
           SMALL SPARKLES
        ========================= */

        .sparkle {

            position: fixed;

            color: white;

            font-size: 25px;

            animation: sparkle 2s infinite ease-in-out;

            z-index: 2;
        }

        @keyframes sparkle {

            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            h1 {
                font-size: 38px;
            }

            .subtitle {
                font-size: 16px;
            }

            .calculator {
                width: 320px;
            }

            button {
                height: 58px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         FLOATING BUBBLES
    ========================= -->

    <div class="bubble bubble1"></div>
    <div class="bubble bubble2"></div>
    <div class="bubble bubble3"></div>
    <div class="bubble bubble4"></div>
    <div class="bubble bubble5"></div>


    <!-- =========================
         CUTE DECORATIONS
    ========================= -->

    <div class="decoration heart1">💗</div>

    <div class="decoration heart2">💜</div>

    <div class="decoration butterfly">🦋</div>

    <div class="decoration star">⭐</div>

    <div class="decoration bunny">🐰</div>


    <!-- SPARKLES -->

    <div class="sparkle" style="left: 30%; top: 12%;">✦</div>

    <div class="sparkle" style="right: 30%; top: 65%;">✧</div>

    <div class="sparkle" style="left: 15%; bottom: 25%;">✦</div>

    <div class="sparkle" style="right: 10%; top: 45%;">✧</div>


    <!-- =========================
         MAIN PAGE
    ========================= -->

    <div class="page">

        <h1>My Calculator</h1>

        <div class="subtitle">
            Small clicks... Big dreams ♡
        </div>


        <!-- =========================
             CALCULATOR
        ========================= -->

        <div class="calculator">


            <!-- DISPLAY -->

            <input
                type="text"
                id="display"
                value="0"
                readonly
            >


            <!-- BUTTONS -->

            <div class="buttons">


                <!-- ROW 1 -->

                <button
                    class="purple"
                    onclick="clearDisplay(this)">
                    C
                </button>

                <button
                    class="purple"
                    onclick="deleteLast(this)">
                    ⌫
                </button>

                <button
                    class="blue"
                    onclick="addValue('%', this)">
                    %
                </button>

                <button
                    class="orange"
                    onclick="addValue('/', this)">
                    ÷
                </button>


                <!-- ROW 2 -->

                <button
                    onclick="addValue('7', this)">
                    7
                </button>

                <button
                    class="purple"
                    onclick="addValue('8', this)">
                    8
                </button>

                <button
                    class="blue"
                    onclick="addValue('9', this)">
                    9
                </button>

                <button
                    class="orange"
                    onclick="addValue('*', this)">
                    ×
                </button>


                <!-- ROW 3 -->

                <button
                    onclick="addValue('4', this)">
                    4
                </button>

                <button
                    class="purple"
                    onclick="addValue('5', this)">
                    5
                </button>

                <button
                    class="blue"
                    onclick="addValue('6', this)">
                    6
                </button>

                <button
                    class="orange"
                    onclick="addValue('-', this)">
                    −
                </button>


                <!-- ROW 4 -->

                <button
                    onclick="addValue('1', this)">
                    1
                </button>

                <button
                    class="purple"
                    onclick="addValue('2', this)">
                    2
                </button>

                <button
                    class="blue"
                    onclick="addValue('3', this)">
                    3
                </button>

                <button
                    class="orange"
                    onclick="addValue('+', this)">
                    +
                </button>


                <!-- ROW 5 -->

                <button
                    class="zero"
                    onclick="addValue('0', this)">
                    0
                </button>

                <button
                    class="green"
                    onclick="addValue('.', this)">
                    .
                </button>

                <button
                    class="equals"
                    onclick="calculate(this)">
                    =
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        let display = document.getElementById("display");


        /* =========================
           ADD NUMBER / OPERATOR
        ========================= */

        function addValue(value, button) {

            popButton(button);

            if (display.value === "0") {
                display.value = value;
            }

            else {
                display.value += value;
            }
        }


        /* =========================
           CLEAR
        ========================= */

        function clearDisplay(button) {

            popButton(button);

            display.value = "0";
        }


        /* =========================
           DELETE LAST
        ========================= */

        function deleteLast(button) {

            popButton(button);

            display.value = display.value.slice(0, -1);

            if (display.value === "") {
                display.value = "0";
            }
        }


        /* =========================
           CALCULATE
        ========================= */

        function calculate(button) {

            popButton(button);

            try {

                let expression = display.value;

                let answer = eval(expression);

                display.value = answer;

            }

            catch {

                display.value = "Error";

            }
        }


        /* =========================
           BUBBLE POP ANIMATION
        ========================= */

        function popButton(button) {

            button.classList.remove("pop");

            void button.offsetWidth;

            button.classList.add("pop");

            setTimeout(function() {

                button.classList.remove("pop");

            }, 250);
        }


        /* =========================
           KEYBOARD SUPPORT
        ========================= */

        document.addEventListener("keydown", function(event) {

            let key = event.key;


            if (
                (key >= "0" && key <= "9") ||
                key === "+" ||
                key === "-" ||
                key === "*" ||
                key === "/" ||
                key === "." ||
                key === "%"
            ) {

                addValue(key, document.querySelector(".buttons button"));

            }


            else if (key === "Enter") {

                calculate(document.querySelector(".equals"));

            }


            else if (key === "Backspace") {

                deleteLast(document.querySelector(".purple"));

            }


            else if (key === "Escape") {

                clearDisplay(document.querySelector(".purple"));

            }

        });

    </script>

</body>
</html>
